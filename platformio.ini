[common]
platform = espressif32@^6.0.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv

[env:esp32cam_security]
; The application. camera_probe.cpp is a standalone diagnostic with its own
; setup()/loop(), so it must be excluded here.
build_src_filter = +<*> -<camera_probe.cpp> -<pin_probe.cpp>

; Pinned to the 6.x line. Unpinned, a platform update can silently change the
; Arduino core and break the build months later with no local change.
platform = espressif32@^6.0.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_flags =
    -I include
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-Wno-deprecated-declarations
; esp32-camera and SD_MMC are both bundled with the Arduino ESP32 core. Listing
; them here made PlatformIO resolve a second copy of esp32-camera from the
; registry, which can shadow the core's version.
lib_ignore =
    WiFi101
    WiFi101_Generic
    WiFiEspAT
    WiFiMulti-Generic
	WiFiNINA_Generic

[env:camera_probe]
; Hardware diagnostic only -- sweeps camera configurations to find which ones
; actually capture. See src/camera_probe.cpp.
extends = common
build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Wno-deprecated-declarations
build_src_filter = -<*> +<camera_probe.cpp>

[env:pin_probe]
; Hardware diagnostic only -- reports every transition on the motion pin.
; See src/pin_probe.cpp.
extends = common
build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Wno-deprecated-declarations
build_src_filter = -<*> +<pin_probe.cpp>
